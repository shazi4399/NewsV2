name: RSS Feishu Bot

on:
  schedule:
    # 每30min运行一次（UTC 时间）
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rss-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 RSS 推送脚本
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python main.py

      - name: 提交状态文件变更
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update last_rss_link.txt [skip ci]"
          file_pattern: "last_rss_link.txt"
